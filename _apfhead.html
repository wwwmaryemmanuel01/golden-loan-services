<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C9A227'/%3E%3Ctext x='16' y='22' font-size='14' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23241C00'%3EG%3C/text%3E%3C/svg%3E" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'" />
<title>Loan Application — GOLDEN FINANCIAL SERVICES</title>
<style>
  :root{
    --gold:#C9A227; --gold-bright:#E8C860; --gold-soft:#FBF3D8; --gold-dark:#8A6D0F;
    --ink:#0F1115; --ink-2:#171A21; --ink-3:#22262F;
    --line:#E6E8EE; --line-2:#F0F1F5; --muted:#6B7280; --muted-2:#8A90A0;
    --bg:#F4F5F8; --card:#FFFFFF;
    --green:#1E9E6A; --green-soft:#E7F6EF;
    --red:#D93F3F; --red-soft:#FDECEC;
    --amber:#E08C1E; --amber-soft:#FFF4E0;
    --blue:#2F6FED; --blue-soft:#EAF0FE;
    --purple:#7C5CF0; --purple-soft:#F1ECFE;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,18,24,.06), 0 8px 24px rgba(16,18,24,.055);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
    display:flex;min-height:100vh;font-size:14px;
  }
  /* ================= SIDEBAR ================= */
  .sidebar{width:262px;flex:0 0 262px;background:var(--ink);color:#C7CBD4;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
  .brand{display:flex;gap:11px;align-items:center;padding:20px 18px 18px;border-bottom:1px solid #23262E}
  .brand-mark{width:42px;height:42px;flex:0 0 42px;border-radius:12px;
    background:linear-gradient(145deg,#E8C860,#B58C1B);display:grid;place-items:center;
    color:#2A2100;font-weight:800;font-size:16px;letter-spacing:.4px;
    box-shadow:0 4px 14px rgba(201,162,39,.35)}
  .brand-name{font-size:12.5px;font-weight:800;line-height:1.28;color:#fff;letter-spacing:.35px}
  .brand-sub{font-size:9.5px;letter-spacing:1.5px;color:var(--gold);font-weight:700;margin-top:3px}
  .nav{overflow-y:auto;padding:12px 10px;flex:1}
  .nav::-webkit-scrollbar{width:6px}
  .nav::-webkit-scrollbar-thumb{background:#2C303A;border-radius:8px}
  .nav-label{font-size:9.5px;letter-spacing:1.4px;color:#666C7A;font-weight:700;
    padding:13px 12px 7px;text-transform:uppercase}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;
    font-size:13px;font-weight:500;color:#B9BFCB;cursor:pointer;text-decoration:none;
    transition:.16s;position:relative}
  .nav-item:hover{background:#1B1F27;color:#fff}
  .nav-item.active{background:linear-gradient(90deg,rgba(201,162,39,.20),rgba(201,162,39,.05));
    color:#fff;font-weight:600}
  .nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
    border-radius:0 4px 4px 0;background:var(--gold)}
  .nav-item svg{width:17px;height:17px;flex:0 0 17px;opacity:.9}
  .nav-item .pill{margin-left:auto;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:20px;
    background:#2A2F3A;color:#D6DAE3}
  .nav-item .pill.gold{background:var(--gold);color:#241C00}
  .nav-item .pill.red{background:#3A2224;color:#F19999}
  .sidebar-foot{padding:12px 14px;border-top:1px solid #23262E;display:flex;align-items:center;gap:10px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--ink-3);color:var(--gold-bright);
    display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 34px;border:1px solid #333846}
  .sf-name{font-size:12px;font-weight:600;color:#fff;line-height:1.3}
  .sf-role{font-size:10px;color:#7A808D}
  /* ================= TOPBAR ================= */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:0 24px;height:64px;display:flex;align-items:center;gap:12px}
  .topbar > div:first-of-type{min-width:0;flex:0 1 auto}
  .page-title{font-size:16.5px;font-weight:700;letter-spacing:-.2px}
  .page-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:440px}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:#F1F2F6;
    border:1px solid transparent;border-radius:10px;padding:8px 11px;width:260px}
  .search:focus-within{background:#fff;border-color:var(--gold)}
  .search input{border:0;background:transparent;outline:none;font-size:12.5px;width:100%;color:var(--ink)}
  .search input::placeholder{color:#9AA0AC}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;
    display:grid;place-items:center;cursor:pointer;position:relative;transition:.15s}
  .icon-btn:hover{border-color:var(--gold);background:var(--gold-soft)}
  .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);
    border:2px solid #fff}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:8px 13px;font-size:12px;
    font-weight:600;cursor:pointer;border:1px solid transparent;transition:.15s;font-family:inherit;
    white-space:nowrap}
  .btn-gold{background:linear-gradient(145deg,#E0BC4E,#B58C1B);color:#241C00;
    box-shadow:0 4px 12px rgba(201,162,39,.3)}
  .btn-gold:hover{filter:brightness(1.06)}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--gold);background:var(--gold-soft)}
  .btn-sm{padding:5px 9px;font-size:11px;border-radius:8px}
  /* ================= SECTION SUBNAV ================= */
  .subnav{position:sticky;top:64px;z-index:25;background:rgba(244,245,248,.96);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:9px 24px;display:flex;gap:6px;overflow-x:auto}
  .subnav::-webkit-scrollbar{height:0}
  .snav{flex:0 0 auto;font-size:11.5px;font-weight:600;color:#5A6172;background:#fff;
    border:1px solid var(--line);border-radius:20px;padding:5px 11px;cursor:pointer;
    text-decoration:none;transition:.15s;white-space:nowrap}
  .snav:hover{border-color:var(--gold);color:var(--gold-dark);background:var(--gold-soft)}
  .snav.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .content{padding:20px 24px 56px;flex:1;max-width:1720px;width:100%}
  /* ================= SECTIONS ================= */
  .sec{margin-bottom:26px;scroll-margin-top:118px}
  .sec-head{display:flex;align-items:flex-start;gap:11px;margin-bottom:12px}
  .sec-num{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--ink);
    color:var(--gold-bright);display:grid;place-items:center;font-size:11.5px;font-weight:800}
  .sec-head h2{font-size:14.5px;font-weight:700;letter-spacing:-.15px;line-height:1.3}
  .sec-head p{font-size:11.5px;color:var(--muted);margin-top:2px}
  .sec-tools{margin-left:auto;display:flex;gap:7px;align-items:center}
  /* ================= CARDS & GRIDS ================= */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .grid{display:grid;gap:13px;align-content:start}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2-1{grid-template-columns:1.55fr 1fr;align-items:start}
  .g-1-1-1{grid-template-columns:1fr 1fr 1fr;align-items:start}
  .pad{padding:15px}
  /* KPI / stat tile */
  .stat{padding:14px;position:relative;overflow:hidden}
  .stat::after{content:"";position:absolute;right:-34px;bottom:-46px;width:118px;height:118px;border-radius:50%;
    background:radial-gradient(circle,rgba(201,162,39,.09),transparent 70%)}
  .stat-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .stat-label{font-size:10.5px;font-weight:700;letter-spacing:.65px;text-transform:uppercase;color:var(--muted);
    line-height:1.35;min-height:28px}
  .stat-ic{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;flex:0 0 29px;
    background:var(--gold-soft);color:var(--gold-dark)}
  .stat-ic.g{background:var(--green-soft);color:#157A50}
  .stat-ic.r{background:var(--red-soft);color:#B32C2C}
  .stat-ic.b{background:var(--blue-soft);color:#2456C4}
  .stat-ic.p{background:var(--purple-soft);color:#5A3FCB}
  .stat-ic.a{background:var(--amber-soft);color:#9A6A0D}
  .stat-val{font-size:21px;font-weight:800;letter-spacing:-.6px;margin-top:8px;
    font-variant-numeric:tabular-nums;line-height:1.1}
  .stat-val small{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:0}
  .stat-foot{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--muted);
    flex-wrap:wrap}
  .trend{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:11px}
  .up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--muted)}
  .spark{margin-top:10px;height:30px;width:100%;display:block}
  /* compact status tile */
  .mini{padding:12px 13px;display:flex;align-items:center;gap:10px}
  .mini .m-ic{width:32px;height:32px;border-radius:9px;flex:0 0 32px;display:grid;place-items:center;
    font-size:12px;font-weight:800}
  .mini .m-v{font-size:17px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums;line-height:1.15}
  .mini .m-l{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px;line-height:1.3;min-height:14px}
  .mini .m-r{margin-left:auto;text-align:right;font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:20px;white-space:nowrap}
  /* panels */
  .panel{padding:15px}
  .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:2px}
  .panel-title{font-size:13px;font-weight:700;letter-spacing:-.1px}
  .panel-sub{font-size:11px;color:var(--muted);margin-top:2px}
  .legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .lg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:600}
  .lg i{width:8px;height:8px;border-radius:3px;display:block}
  .chart-wrap{margin-top:10px}
  svg.chart{width:100%;height:auto;display:block;overflow:visible}
  /* statement rows */
  .stmt{margin-top:8px}
  .stmt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;
    border-bottom:1px dashed #EDEFF4;font-size:12.5px}
  .stmt-row:last-child{border-bottom:0}
  .stmt-row .k{color:#3A3F4A;font-weight:600;display:flex;align-items:center;gap:7px}
  .stmt-row .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .stmt-row.total{border-top:1.5px solid var(--line);border-bottom:0;margin-top:4px;padding-top:11px;
    font-size:13.5px}
  .stmt-row.total .v{font-size:15px;font-weight:800}
  .stmt-row.neg .v{color:var(--red)}
  .stmt-row.pos .v{color:var(--green)}
  .kdot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  /* horizontal bars */
  .hbar-row{display:grid;grid-template-columns:96px 1fr 76px;align-items:center;gap:10px;margin-bottom:9px}
  .hbar-row:last-child{margin-bottom:0}
  .hbar-l{font-size:11px;font-weight:600;color:#3A3F4A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbar-t{height:16px;background:var(--line-2);border-radius:5px;overflow:hidden;position:relative}
  .hbar-t i{display:block;height:100%;border-radius:5px;min-width:3px}
  .hbar-v{font-size:11px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  /* progress */
  .bar{height:6px;background:var(--line-2);border-radius:20px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#E0BC4E,#B58C1B)}
  .bar.blue i{background:linear-gradient(90deg,#6C9BF5,#2F6FED)}
  .bar.green i{background:linear-gradient(90deg,#4CC08D,#1E9E6A)}
  .bar.red i{background:linear-gradient(90deg,#EA7C7C,#D93F3F)}
  .prog-row{margin-bottom:12px}
  .prog-row:last-child{margin-bottom:0}
  .prog-top{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;margin-bottom:5px}
  .prog-top b{font-weight:700;color:#2B303B}
  .prog-top span{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
  /* tables */
  .tbl-wrap{overflow-x:auto;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  thead th{text-align:left;font-size:9.5px;letter-spacing:.75px;text-transform:uppercase;color:var(--muted-2);
    font-weight:700;padding:0 10px 8px;white-space:nowrap;border-bottom:1px solid var(--line)}
  tbody td{padding:8px 9px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#FCFAF2}
  .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .who{display:flex;align-items:center;gap:9px}
  .who .av{width:28px;height:28px;border-radius:50%;flex:0 0 28px;display:grid;place-items:center;
    font-size:10px;font-weight:800;background:var(--gold-soft);color:var(--gold-dark)}
  .who .nm{font-weight:600;line-height:1.25;font-size:12px;white-space:nowrap}
  .who .id{font-size:10px;color:var(--muted);margin-top:1px}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;
    border-radius:20px;white-space:nowrap}
  .badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .b-pend{background:var(--amber-soft);color:#9A6A0D}
  .b-appr{background:var(--green-soft);color:#157A50}
  .b-rev{background:var(--red-soft);color:#B32C2C}
  .b-act{background:var(--blue-soft);color:#2456C4}
  .b-cls{background:#F1F2F6;color:#5A6172}
  .b-gray{background:#F1F2F6;color:#5A6172}
  .b-purple{background:var(--purple-soft);color:#5A3FCB}
  /* lists */
  .list{display:flex;flex-direction:column;margin-top:6px}
  .li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #EDEFF4}
  .li:last-child{border-bottom:0}
  .li .av{width:29px;height:29px;border-radius:9px;flex:0 0 29px;display:grid;place-items:center;
    font-size:10px;font-weight:800;background:#F1F2F6;color:#4A5160}
  .li .t1{font-size:12px;font-weight:600;line-height:1.3}
  .li .t2{font-size:10.5px;color:var(--muted);margin-top:1px}
  .li .amt{margin-left:auto;text-align:right;flex:0 0 auto}
  .li .amt b{display:block;font-size:12px;font-variant-numeric:tabular-nums}
  .li .amt span{font-size:10px;color:var(--muted)}
  /* agent bars */
  .ag-row{margin-bottom:11px}
  .ag-row:last-child{margin-bottom:0}
  .ag-top{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px;gap:8px}
  .ag-top b{font-weight:700}
  .ag-top span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px;font-weight:600}
  /* tabs */
  .tabs{display:flex;gap:3px;background:#F1F2F6;padding:3px;border-radius:9px;flex-wrap:wrap}
  .tab{border:0;background:transparent;font-family:inherit;font-size:11px;font-weight:700;color:var(--muted);
    padding:5px 9px;border-radius:6px;cursor:pointer;transition:.15s;white-space:nowrap}
  .tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,18,24,.12)}
  .subtabs{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
  .stab{border:1px solid var(--line);background:#fff;border-radius:20px;font-family:inherit;
    font-size:10.5px;font-weight:700;color:#5A6172;padding:4px 10px;cursor:pointer;transition:.15s}
  .stab.on{background:var(--ink);border-color:var(--ink);color:#fff}
  /* quick actions */
  .qa-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
  .qa{border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;background:#fff;
    transition:.16s;display:flex;flex-direction:column;gap:8px;text-align:left;font-family:inherit}
  .qa:hover{border-color:var(--gold);background:var(--gold-soft);transform:translateY(-1px)}
  .qa .qi{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;
    background:var(--gold-soft);color:var(--gold-dark)}
  .qa:hover .qi{background:#fff}
  .qa .qt{font-size:11.5px;font-weight:700;color:#2B303B;line-height:1.3}
  .qa .qs{font-size:10px;color:var(--muted);line-height:1.35}
  /* alerts */
  .alert{padding:13px;display:flex;gap:10px;align-items:flex-start;border-left:3px solid var(--line)}
  .alert.hi{border-left-color:var(--red)}
  .alert.md{border-left-color:var(--amber)}
  .alert.lo{border-left-color:var(--blue)}
  .alert .a-ic{width:28px;height:28px;border-radius:8px;flex:0 0 28px;display:grid;place-items:center}
  .alert.hi .a-ic{background:var(--red-soft);color:#B32C2C}
  .alert.md .a-ic{background:var(--amber-soft);color:#9A6A0D}
  .alert.lo .a-ic{background:var(--blue-soft);color:#2456C4}
  .alert .a-v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .alert .a-l{font-size:11px;font-weight:700;color:#2B303B;margin-top:2px;line-height:1.3}
  .alert .a-s{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .alert .a-lnk{font-size:10.5px;font-weight:800;color:var(--gold-dark);margin-top:7px;display:inline-flex;
    align-items:center;gap:4px;cursor:pointer}
  .alert:hover{box-shadow:0 6px 20px rgba(16,18,24,.09)}
  /* system status */
  .sysrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed #EDEFF4;
    font-size:12px}
  .sysrow:last-child{border-bottom:0}
  .sysrow .k{font-weight:600;color:#3A3F4A}
  .sysrow .v{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:700;font-size:11.5px;
    white-space:nowrap}
  .live{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(30,158,106,.16)}
  .dead{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(217,63,63,.16)}
  .notice{display:flex;gap:10px;align-items:flex-start;background:#FFF9E8;border:1px solid #F2E3B0;
    border-radius:11px;padding:10px 13px;font-size:11.5px;color:#7A5C08;line-height:1.5}
  .notice b{font-weight:800}
  .placeholder{padding:60px 24px;text-align:center}
  .placeholder h3{font-size:16px;margin-bottom:8px}
  .placeholder p{font-size:13px;color:var(--muted);max-width:440px;margin:0 auto;line-height:1.6}
  .hide{display:none!important}
  .muted{color:var(--muted)}
  .tiny{font-size:10.5px}
  /* ================= RESPONSIVE ================= */
  @media(max-width:1450px){ #periodTabs{display:none} }
  @media(max-width:1120px){
    .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g-2-1,.g-1-1-1{grid-template-columns:1fr}
    .qa-grid{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:1024px){
    .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g2{grid-template-columns:1fr}
  }
  @media(max-width:860px){
    .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.22s}
    .sidebar.open{transform:none;box-shadow:0 0 0 100vmax rgba(15,17,21,.45)}
    .menu-btn{display:grid!important}
    .search{display:none}
    .content{padding:16px 14px 40px}
    .topbar{padding:0 14px}
    .subnav{padding:8px 14px;top:60px}
    .topbar{height:60px}
    .g-1-1-1{grid-template-columns:1fr}
  }
  @media(max-width:620px){
    .g4,.g3,.g2,.qa-grid{grid-template-columns:1fr}
    .g4.two{grid-template-columns:1fr 1fr}
  }
  .menu-btn{display:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
    background:#fff;place-items:center;cursor:pointer}
  /* ===================== BACK NAVIGATION ===================== */
  .backbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 9px;
    border-radius:10px;border:1px solid var(--line);background:#fff;color:#3A3F4A;
    font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;flex:0 0 auto;transition:.15s}
  .backbtn:hover{border-color:var(--gold);background:var(--gold-soft);color:#6B5310}
  .backbtn:active{transform:translateY(1px)}
  .backbtn:disabled{opacity:.42;cursor:not-allowed;background:#F7F8FA;color:#8A90A0}
  .backbtn:disabled:hover{border-color:var(--line);background:#F7F8FA;color:#8A90A0;transform:none}
  .backbtn .bk-arrow{width:14px;height:14px;transition:transform .15s}
  .backbtn:hover:not(:disabled) .bk-arrow{transform:translateX(-2px)}
  @media(max-width:860px){
    .backbtn{width:36px;height:36px;padding:0;justify-content:center;border-radius:10px}
    .backbtn .bk-label{display:none}
  }
  @media(max-width:620px){
    .backbtn{width:38px;height:38px;border-radius:11px}
    .backbtn .bk-arrow{width:16px;height:16px}
    .topbar{gap:8px}
    .topbar .btn-ghost,.topbar .icon-btn{display:none}
    .page-sub{display:none}
  }

/* ============================================================================
   CUSTOMER APPLICATION FORM + LOAN AGREEMENT
   Shared by apply.html and agreement.html. The system theme does the rest.
   ========================================================================= */

  body.cust{background:#EDF6F1;display:block}
  body.cust .main{width:100%}

  /* the customer header is light, not the staff dark band */
  .custbar{
    background:#0F1115;border-bottom:1px solid #23262E;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:12px 22px;min-height:0;height:auto;
  }
  .custbrand{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0}
  .custbrand img{height:32px;width:32px;flex:0 0 auto}
  .custbrand span{display:flex;flex-direction:column;min-width:0}
  .custbrand b{
    font-size:16px;font-weight:800;letter-spacing:.7px;color:#fff;line-height:1.15;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .custbrand i{
    font-style:normal;font-size:9px;font-weight:800;letter-spacing:2.6px;color:#E4C264;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .custnav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .custnav a{
    font-size:11.5px;font-weight:700;color:#DCE2EC;text-decoration:none;
    border:1px solid #2F3541;border-radius:9px;padding:6px 11px;background:#1B1F27;
  }
  .custnav a:hover{border-color:#C9A227;color:#F3D67A}
  .custnav a.on{background:#C9A227;border-color:#B08D1C;color:#241C00}

  /* the form column */
  .sheet{width:100%;max-width:1080px;margin:0 auto;padding:20px 18px 60px}
  @media (max-width:640px){ .sheet{padding:14px 12px 44px} }

  /* progress rail */
  .progwrap{
    position:sticky;top:0;z-index:30;
    background:rgba(237,246,241,.95);backdrop-filter:blur(8px);
    border-bottom:1px solid #CFE2D9;padding:9px 0 10px;margin-bottom:16px;
  }
  .progwrap .ptop{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
  .progwrap .pt{font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:#3F5B50}
  .progwrap .pc{font-size:10.5px;font-weight:800;color:#116B49;font-variant-numeric:tabular-nums}
  .progbar{height:8px;border-radius:20px;background:#DCEAE3;overflow:hidden;margin-top:7px}
  .progbar i{display:block;height:100%;background:linear-gradient(90deg,#0E9F6E,#2DD4BF);width:0;transition:width .25s ease}
  .progchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .progchips a{
    font-size:10px;font-weight:700;color:#41514B;text-decoration:none;
    background:#fff;border:1px solid #CFE2D9;border-radius:20px;padding:3px 9px;
  }
  .progchips a.on{background:#0F1115;border-color:#0F1115;color:#fff}
  .progchips a.done{border-color:#8FC7AF;background:#EAF7F1;color:#116B49}

  /* form fields, larger and friendlier than the staff tables */
  .fg label{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#3F4A57}
  .fg input,.fg select,.fg textarea{
    font-size:13px;padding:9px 11px;border-radius:10px;
    border:1.5px solid #7FAF9C;background:#fff;color:#1D2430;width:100%;
  }
  .fg textarea{min-height:74px;resize:vertical}
  .fg input:focus,.fg select:focus,.fg textarea:focus{
    outline:none;border-color:#059669;box-shadow:0 0 0 3px rgba(5,150,105,.16);
  }
  .fg input.bad,.fg select.bad,.fg textarea.bad{border-color:#D93F3F;box-shadow:0 0 0 3px rgba(217,63,63,.14)}
  .fg .err{font-size:9.5px;font-weight:700;color:#A62424;min-height:12px}
  .fg .hint{font-size:9.5px;color:#667085;line-height:1.45}
  .fg .req{color:#A62424}
  .fg.full{grid-column:1 / -1}

  .form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  @media (max-width:760px){
    .form-grid.two,.form-grid.three{grid-template-columns:1fr}
  }

  /* choice rows */
  .choicegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}
  .choicebox{
    display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border-radius:11px;
    border:1.5px solid #A9CDBD;background:#fff;cursor:pointer;
  }
  .choicebox input{margin-top:2px;flex:0 0 auto;width:16px;height:16px;accent-color:#059669}
  .choicebox span{font-size:11px;line-height:1.5;color:#2B303B}
  .choicebox b{display:block;font-size:11.5px;font-weight:800;color:#12151B}
  .choicebox:has(input:checked){border-color:#059669;background:#F4FCF8}

  /* the signature pad */
  .sigwrap{border:2px solid #7FB49F;border-radius:12px;background:#fff;padding:10px}
  .sigpad{display:block;width:100%;height:170px;border-radius:9px;background:repeating-linear-gradient(0deg,#fff,#fff 27px,#EFF6F2 27px,#EFF6F2 28px);touch-action:none;cursor:crosshair}
  .sigpad.touched{background:#fff}
  .sigrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .sigmeta{font-size:10px;color:#667085;line-height:1.5}
  .signote{font-size:10px;font-weight:700;color:#8A5B08;background:#FFF5E3;border:1px solid #F3DFB6;border-radius:9px;padding:7px 10px;margin-top:8px}

  /* declaration list */
  .decl{display:grid;gap:8px}
  .decl label{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.6;color:#2B303B;cursor:pointer}
  .decl input{margin-top:2px;width:16px;height:16px;accent-color:#059669;flex:0 0 auto}

  /* submitted banner */
  .donebox{
    border:2px solid #1E9E6A;background:#F2FBF6;border-radius:14px;padding:16px 18px;
  }
  .donebox h3{font-size:16px;font-weight:800;color:#116B49}
  .donebox p{font-size:12px;color:#33544A;margin-top:4px;line-height:1.6}
  .donebox .ref{
    display:inline-block;margin-top:9px;font-family:ui-monospace,Consolas,monospace;font-size:14px;font-weight:800;
    background:#0F1115;color:#E9C766;border-radius:9px;padding:6px 12px;letter-spacing:1px;
  }

  /* agreement reading column */
  .terms{counter-reset:cl}
  .terms .clause{border-bottom:1px dashed #CFE2D9;padding:12px 0}
  .terms .clause:last-child{border-bottom:0}
  .terms h3{font-size:13px;font-weight:800;color:#12151B;display:flex;gap:9px;align-items:baseline}
  .terms h3 span{
    flex:0 0 auto;font-size:10px;font-weight:800;color:#0F1115;background:#E9C766;
    border-radius:6px;padding:1px 7px;
  }
  .terms p{font-size:12px;line-height:1.7;color:#31394A;margin-top:5px}
  .terms ul{margin:6px 0 0 18px}
  .terms li{font-size:11.5px;line-height:1.7;color:#31394A}
  .terms .k{font-weight:800;color:#12151B}
  .terms .warnbox{
    border-left:4px solid #D93F3F;background:#FFF7F7;border-radius:0 10px 10px 0;
    padding:9px 12px;margin-top:8px;font-size:11.5px;color:#7A1F1F;line-height:1.6;
  }
  .terms .okbox{
    border-left:4px solid #1E9E6A;background:#F4FCF8;border-radius:0 10px 10px 0;
    padding:9px 12px;margin-top:8px;font-size:11.5px;color:#14523C;line-height:1.6;
  }

  /* sticky action bar at the foot of a form */
  .formfoot{
    position:sticky;bottom:0;z-index:20;margin-top:16px;
    background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
    border:2px solid #7FB49F;border-radius:14px;
    padding:11px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    box-shadow:0 -6px 20px -14px rgba(6,78,59,.5);
  }
  .formfoot .fk{font-size:10.5px;color:#667085;line-height:1.5;min-width:0;flex:1 1 220px}
  .formfoot .btn{flex:0 0 auto}

  /* hero block on the customer pages */
  .custhero{margin:0 0 16px}
  .custhero h1{font-size:22px;font-weight:800;letter-spacing:-.2px;color:#0F1115;line-height:1.2}
  .custhero p{font-size:12.5px;line-height:1.7;color:#33544A;margin-top:6px;max-width:78ch}
  .custhero p a{color:#116B49;font-weight:800;text-decoration:underline}
  .custhint{
    display:flex;gap:11px;align-items:center;flex-wrap:wrap;justify-content:space-between;
    margin-top:12px;padding:11px 13px;border-radius:12px;
    border:2px solid #A9CDBD;background:#fff;font-size:11.5px;color:#31394A;line-height:1.55;
  }
  .custhint span{min-width:0;flex:1 1 260px}
  .custhint.locked{border-color:#D93F3F;background:#FFF7F7;color:#7A1F1F}
  .custhint.ok{border-color:#1E9E6A;background:#F2FBF6;color:#14523C}
  .custhint .btn{flex:0 0 auto}

  /* a standalone field error line, outside the .fg column */
  .err{font-size:10px;font-weight:700;color:#A62424;min-height:0;margin-top:4px}
  .err:empty{display:none}

  /* neutral empty state inside the customer column */
  .empty{
    border:2px dashed #A9CDBD;border-radius:12px;padding:22px 16px;text-align:center;
    font-size:11.5px;color:#667085;background:#fff;
  }
  .sheet .sec{margin-top:16px}
  .sheet .card.panel{padding:14px 15px}
  .sheet .panel+.sec{margin-top:18px}
  @media (max-width:640px){
    .custhero h1{font-size:18px}
    .terms p,.terms li{font-size:11.5px}
    .sigpad{height:150px}
  }

  @media print{
    .custbar .custnav,.formfoot,.progwrap,.sigrow{display:none !important}
    .sheet{max-width:none;padding:0}
    .custhero h1{font-size:16pt}
    .terms .clause{break-inside:avoid}
  }

  /* toasts (customer pages carry no staff module css) */
  .toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 36px)}
  .toast{
    background:#0F1115;color:#fff;border-radius:11px;padding:11px 14px;font-size:12px;line-height:1.5;
    box-shadow:0 10px 30px rgba(0,0,0,.28);display:flex;gap:9px;align-items:flex-start;max-width:340px;
    border-left:3px solid #1E9E6A;
  }
  .toast.ok{border-left-color:#1E9E6A}
  .toast.err{border-left-color:#D93F3F;background:#3A1010}
  .toast.info{border-left-color:#C9A227}
  .toast span{flex:0 0 auto;font-weight:800;color:#E9C766}
  .toast.err span{color:#FF9E9E}
  @media print{ .toasts{display:none !important} }
</style>
</head>
